<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 790" role="img" aria-labelledby="01-arquitetura-title 01-arquitetura-desc"><title id="01-arquitetura-title">Arquitetura geral</title><desc id="01-arquitetura-desc">Três ambientes: navegador, Cloudflare e laboratório no computador. Planilhas manuais são processadas no navegador. D1 ativo não armazena todas as bases de negócio.</desc><defs><marker id="01-arquitetura-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172334}.node-title{font-size:16px;font-weight:650}.node-sub{font-size:13px;fill:#46576a}.edge-label{font-size:12px;paint-order:stroke;stroke:white;stroke-width:6px;stroke-linejoin:round}</style></defs><rect width="100%" height="100%" fill="white"/><rect x="40" y="35" width="6" height="48" rx="3" fill="#ff941f"/><text x="62" y="55" font-size="24" font-weight="700">Arquitetura geral</text><text x="62" y="82" font-size="14" fill="#526477">Três ambientes: navegador, Cloudflare e laboratório no computador.</text><path d="M320,190 L440,190" fill="none" stroke="#64748b" stroke-width="1.8"  marker-end="url(#01-arquitetura-arrow)"/><text x="380" y="180" text-anchor="middle" class="edge-label">HTTP /api</text><path d="M720,190 L840,190" fill="none" stroke="#64748b" stroke-width="1.8"  marker-end="url(#01-arquitetura-arrow)"/><text x="780" y="180" text-anchor="middle" class="edge-label">OAuth / leitura</text><path d="M180,240 L180,370" fill="none" stroke="#64748b" stroke-width="1.8"  marker-end="url(#01-arquitetura-arrow)"/><text x="192" y="305" text-anchor="start" class="edge-label">Estado React</text><path d="M180,470 L180,600" fill="none" stroke="#64748b" stroke-width="1.8"  marker-end="url(#01-arquitetura-arrow)"/><text x="192" y="535" text-anchor="start" class="edge-label">Persistência seletiva</text><path d="M580,240 L580,370" fill="none" stroke="#64748b" stroke-width="1.8"  marker-end="url(#01-arquitetura-arrow)"/><text x="592" y="305" text-anchor="start" class="edge-label">Acesso</text><path d="M720,205 L770,205 L770,420 L840,420" fill="none" stroke="#64748b" stroke-width="1.8"  marker-end="url(#01-arquitetura-arrow)"/><text x="782" y="312.5" text-anchor="start" class="edge-label">Diagnóstico HTTPS</text><path d="M320,440 L370,440 L370,650 L440,650" fill="none" stroke="#64748b" stroke-width="1.8"  marker-end="url(#01-arquitetura-arrow)"/><text x="382" y="545" text-anchor="start" class="edge-label">Assistente: HTTP local</text><path d="M720,650 L840,650" fill="none" stroke="#64748b" stroke-width="1.8"  marker-end="url(#01-arquitetura-arrow)"/><text x="780" y="640" text-anchor="middle" class="edge-label">CLI + ferramentas</text><g><rect x="40" y="140" width="280" height="100" rx="13" fill="#eef4ff" stroke="#5484c8" stroke-width="1.6" /><text x="58" y="178" class="node-title">Navegador</text><text x="58" y="205" class="node-sub">React · interface e análises</text></g><g><rect x="440" y="140" width="280" height="100" rx="13" fill="#e9f7ee" stroke="#42996a" stroke-width="1.6" /><text x="458" y="178" class="node-title">Cloudflare Worker</text><text x="458" y="205" class="node-sub">API autenticada · /api/*</text></g><g><rect x="840" y="140" width="280" height="100" rx="13" fill="#e9f7ee" stroke="#42996a" stroke-width="1.6" /><text x="858" y="178" class="node-title">Google Sheets + Zoho</text><text x="858" y="205" class="node-sub">Consultas privadas de leitura</text></g><g><rect x="40" y="370" width="280" height="100" rx="13" fill="#eef4ff" stroke="#5484c8" stroke-width="1.6" /><text x="58" y="408" class="node-title">Workspace + módulos</text><text x="58" y="435" class="node-sub">Bases e filtros da sessão</text></g><g><rect x="440" y="370" width="280" height="100" rx="13" fill="#e4f6f4" stroke="#2b9086" stroke-width="1.6" /><text x="458" y="408" class="node-title">D1 · USERS_DB</text><text x="458" y="435" class="node-sub">Usuários e permissões</text></g><g><rect x="840" y="370" width="280" height="100" rx="13" fill="#e9f7ee" stroke="#42996a" stroke-width="1.6" /><text x="858" y="408" class="node-title">Diagnóstico legado Addlog</text><text x="858" y="435" class="node-sub">Token no servidor · leitura manual</text></g><g><rect x="40" y="600" width="280" height="100" rx="13" fill="#e4f6f4" stroke="#2b9086" stroke-width="1.6" /><text x="58" y="638" class="node-title">Armazenamento local</text><text x="58" y="665" class="node-sub">Preferências, consumo, lembretes</text></g><g><rect x="440" y="600" width="280" height="100" rx="13" fill="#f2ebff" stroke="#9670cc" stroke-width="1.6" /><text x="458" y="638" class="node-title">Ponte local · 5681</text><text x="458" y="665" class="node-sub">Acervo + ferramentas restritas</text></g><g><rect x="840" y="600" width="280" height="100" rx="13" fill="#f2ebff" stroke="#9670cc" stroke-width="1.6" /><text x="858" y="638" class="node-title">n8n local + Gemini</text><text x="858" y="665" class="node-sub">Modelo explica resultados</text></g><text x="40" y="765" font-size="12" fill="#526477">Planilhas manuais são processadas no navegador. D1 ativo não armazena todas as bases de negócio.</text></svg>