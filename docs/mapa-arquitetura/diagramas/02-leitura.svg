<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 790" role="img" aria-labelledby="02-leitura-title 02-leitura-desc"><title id="02-leitura-title">Da fonte ao indicador</title><desc id="02-leitura-desc">A entrada muda; o importador e as regras analíticas continuam compartilhados. Ausência não vira zero automaticamente. Filtros de análise e busca da grade têm alcances próprios.</desc><defs><marker id="02-leitura-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172334}.node-title{font-size:16px;font-weight:650}.node-sub{font-size:13px;fill:#46576a}.edge-label{font-size:12px;paint-order:stroke;stroke:white;stroke-width:6px;stroke-linejoin:round}</style></defs><rect width="100%" height="100%" fill="white"/><rect x="40" y="35" width="6" height="48" rx="3" fill="#ff941f"/><text x="62" y="55" font-size="24" font-weight="700">Da fonte ao indicador</text><text x="62" y="82" font-size="14" fill="#526477">A entrada muda; o importador e as regras analíticas continuam compartilhados.</text><path d="M720,190 L840,190" fill="none" stroke="#64748b" stroke-width="1.8"  marker-end="url(#02-leitura-arrow)"/><text x="780" y="180" text-anchor="middle" class="edge-label">Snapshot</text><path d="M980,240 L980,370" fill="none" stroke="#64748b" stroke-width="1.8"  marker-end="url(#02-leitura-arrow)"/><text x="992" y="305" text-anchor="start" class="edge-label">Mesma leitura</text><path d="M180,240 L180,295 L980,295 L980,370" fill="none" stroke="#64748b" stroke-width="1.8"  marker-end="url(#02-leitura-arrow)"/><text x="580" y="285" text-anchor="middle" class="edge-label">Leitura manual</text><path d="M840,420 L720,420" fill="none" stroke="#64748b" stroke-width="1.8"  marker-end="url(#02-leitura-arrow)"/><text x="780" y="410" text-anchor="middle" class="edge-label">Preserva origem</text><path d="M440,420 L320,420" fill="none" stroke="#64748b" stroke-width="1.8"  marker-end="url(#02-leitura-arrow)"/><text x="380" y="410" text-anchor="middle" class="edge-label">Recorte</text><path d="M180,470 L180,600" fill="none" stroke="#64748b" stroke-width="1.8"  marker-end="url(#02-leitura-arrow)"/><text x="192" y="535" text-anchor="start" class="edge-label">Registros elegíveis</text><path d="M320,650 L440,650" fill="none" stroke="#64748b" stroke-width="1.8"  marker-end="url(#02-leitura-arrow)"/><text x="380" y="640" text-anchor="middle" class="edge-label">Resultados</text><path d="M720,650 L840,650" fill="none" stroke="#64748b" stroke-width="1.8"  marker-end="url(#02-leitura-arrow)"/><text x="780" y="640" text-anchor="middle" class="edge-label">Detalhar / exportar</text><g><rect x="40" y="140" width="280" height="100" rx="13" fill="#eef4ff" stroke="#5484c8" stroke-width="1.6" /><text x="58" y="178" class="node-title">Excel / CSV local</text><text x="58" y="205" class="node-sub">Arquivo escolhido pelo usuário</text></g><g><rect x="440" y="140" width="280" height="100" rx="13" fill="#e9f7ee" stroke="#42996a" stroke-width="1.6" /><text x="458" y="178" class="node-title">Google via Worker</text><text x="458" y="205" class="node-sub">Retrato da aba autorizada</text></g><g><rect x="840" y="140" width="280" height="100" rx="13" fill="#eef4ff" stroke="#5484c8" stroke-width="1.6" /><text x="858" y="178" class="node-title">Adaptador de fonte</text><text x="858" y="205" class="node-sub">Valida contrato e células</text></g><g><rect x="840" y="370" width="280" height="100" rx="13" fill="#fff1dc" stroke="#df8a25" stroke-width="1.6" /><text x="858" y="408" class="node-title">Importador do módulo</text><text x="858" y="435" class="node-sub">Cabeçalhos · tipos · origem</text></g><g><rect x="440" y="370" width="280" height="100" rx="13" fill="#fff1dc" stroke="#df8a25" stroke-width="1.6" /><text x="458" y="408" class="node-title">Base normalizada</text><text x="458" y="435" class="node-sub">Linhas · células ·