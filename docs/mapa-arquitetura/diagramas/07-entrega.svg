<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" role="img" aria-labelledby="07-entrega-title 07-entrega-desc"><title id="07-entrega-title">Do código à publicação</title><desc id="07-entrega-desc">Fonte versionada, validações, compilação e implantação são etapas distintas. Os scripts do assistente continuam locais. Um build aprovado não valida as credenciais de todos os serviços externos.</desc><defs><marker id="07-entrega-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172334}.node-title{font-size:16px;font-weight:650}.node-sub{font-size:13px;fill:#46576a}.edge-label{font-size:12px;paint-order:stroke;stroke:white;stroke-width:6px;stroke-linejoin:round}</style></defs><rect width="100%" height="100%" fill="white"/><rect x="40" y="35" width="6" height="48" rx="3" fill="#ff941f"/><text x="62" y="55" font-size="24" font-weight="700">Do código à publicação</text><text x="62" y="82" font-size="14" fill="#526477">Fonte versionada, validações, compilação e implantação são etapas distintas.</text><path d="M320,190 L440,190" fill="none" stroke="#64748b" stroke-width="1.8"  marker-end="url(#07-entrega-arrow)"/><text x="380" y="180" text-anchor="middle" class="edge-label">Revisar</text><path d="M720,190 L840,190" fill="none" stroke="#64748b" stroke-width="1.8"  marker-end="url(#07-entrega-arrow)"/><text x="780" y="180" text-anchor="middle" class="edge-label">Compilar</text><path d="M980,240 L980,370" fill="none" stroke="#64748b" stroke-width="1.8"  marker-end="url(#07-entrega-arrow)"/><text x="992" y="305" text-anchor="start" class="edge-label">Artefatos</text><path d="M840,420 L720,420" fill="none" stroke="#64748b" stroke-width="1.8"  marker-end="url(#07-entrega-arrow)"/><text x="780" y="410" text-anchor="middle" class="edge-label">Implantar</text><path d="M440,420 L320,420" fill="none" stroke="#64748b" stroke-width="1.8"  marker-end="url(#07-entrega-arrow)"/><text x="380" y="410" text-anchor="middle" class="edge-label">Servir aplicação</text><g><rect x="40" y="140" width="280" height="100" rx="13" fill="#eef4ff" stroke="#5484c8" stroke-width="1.6" /><text x="58" y="178" class="node-title">Código no Git</text><text x="58" y="205" class="node-sub">src/ · server/ · scripts/</text></g><g><rect x="440" y="140" width="280" height="100" rx="13" fill="#fff1dc" stroke="#df8a25" stroke-width="1.6" /><text x="458" y="178" class="node-title">Validações locais</text><text x="458" y="205" class="node-sub">Imports · formato · testes</text></g><g><rect x="840" y="140" width="280" height="100" rx="13" fill="#fff1dc" stroke="#df8a25" stroke-width="1.6" /><text x="858" y="178" class="node-title">Vite build</text><text x="858" y="205" class="node-sub">Chunks + manifesto + relatório</text></g><g><rect x="40" y="370" width="280" height="100" rx="13" fill="#eef4ff" stroke="#5484c8" stroke-width="1.6" /><text x="58" y="408" class="node-title">Navegador</text><text x="58" y="435" class="node-sub">Assets e páginas sob demanda</text></g><g><rect x="440" y="370" width="280" height="100" rx="13" fill="#e9f7ee" stroke="#42996a" stroke-width="1.6" /><text x="458" y="408" class="node-title">Cloudflare</text><text x="458" y="435" class="node-sub">ASSETS + Worker + D1</text></g><g><rect x="840" y="370" width="280" height="100" rx="13" fill="#e9f7ee" stroke="#42996a" stroke-width="1.6" /><text x="858" y="408" class="node-title">Distribuição / Wrangler</text><text x="858" y="435" class="node-sub">dist/ + server/worker.js</text></g><text x="40" y="595" font-size="12" fill="#526477">Os scripts do assistente continuam locais. Um build aprovado não valida as credenciais de todos os serviços externos.</text></svg>