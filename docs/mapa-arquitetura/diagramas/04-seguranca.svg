<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" role="img" aria-labelledby="04-seguranca-title 04-seguranca-desc"><title id="04-seguranca-title">Fronteiras de acesso</title><desc id="04-seguranca-desc">A interface ajuda a controlar ações; a API verifica identidade e autorização novamente. Segredos dos fornecedores ficam no Worker ou no n8n. Configurar a política Access é uma etapa externa ao código.</desc><defs><marker id="04-seguranca-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker><style>text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172334}.node-title{font-size:16px;font-weight:650}.node-sub{font-size:13px;fill:#46576a}.edge-label{font-size:12px;paint-order:stroke;stroke:white;stroke-width:6px;stroke-linejoin:round}</style></defs><rect width="100%" height="100%" fill="white"/><rect x="40" y="35" width="6" height="48" rx="3" fill="#ff941f"/><text x="62" y="55" font-size="24" font-weight="700">Fronteiras de acesso</text><text x="62" y="82" font-size="14" fill="#526477">A interface ajuda a controlar ações; a API verifica identidade e autorização novamente.</text><path d="M320,190 L440,190" fill="none" stroke="#64748b" stroke-width="1.8"  marker-end="url(#04-seguranca-arrow)"/><text x="380" y="180" text-anchor="middle" class="edge-label">Asserção Access</text><path d="M720,190 L840,190" fill="none" stroke="#64748b" stroke-width="1.8"  marker-end="url(#04-seguranca-arrow)"/><text x="780" y="180" text-anchor="middle" class="edge-label">Consulta de acesso</text><path d="M980,240 L980,300 L580,300 L580,370" fill="none" stroke="#64748b" stroke-width="1.8"  marker-end="url(#04-seguranca-arrow)"/><text x="780" y="290" text-anchor="middle" class="edge-label">Direitos válidos</text><path d="M320,420 L440,420" fill="none" stroke="#64748b" stroke-width="1.8"  marker-end="url(#04-seguranca-arrow)"/><text x="380" y="410" text-anchor="middle" class="edge-label">Chamada /api</text><path d="M720,420 L840,420" fill="none" stroke="#64748b" stroke-width="1.8"  marker-end="url(#04-seguranca-arrow)"/><text x="780" y="410" text-anchor="middle" class="edge-label">Autorizar / recusar</text><path d="M180,240 L180,370" fill="none" stroke="#64748b" stroke-width="1.8"  marker-end="url(#04-seguranca-arrow)"/><text x="192" y="305" text-anchor="start" class="edge-label">Sessão /api/me</text><g><rect x="40" y="140" width="280" height="100" rx="13" fill="#eef4ff" stroke="#5484c8" stroke-width="1.6" /><text x="58" y="178" class="node-title">Usuário / navegador</text><text x="58" y="205" class="node-sub">Login Cloudflare Access</text></g><g><rect x="440" y="140" width="280" height="100" rx="13" fill="#e9f7ee" stroke="#42996a" stroke-width="1.6" /><text x="458" y="178" class="node-title">Worker · valida JWT</text><text x="458" y="205" class="node-sub">Assinatura · emissor · audiência</text></g><g><rect x="840" y="140" width="280" height="100" rx="13" fill="#e4f6f4" stroke="#2b9086" stroke-width="1.6" /><text x="858" y="178" class="node-title">Usuário no D1</text><text x="858" y="205" class="node-sub">Ativo · função · permissões</text></g><g><rect x="40" y="370" width="280" height="100" rx="13" fill="#eef4ff" stroke="#5484c8" stroke-width="1.6" /><text x="58" y="408" class="node-title">Interface autorizada</text><text x="58" y="435" class="node-sub">Páginas e ações concedidas</text></g><g><rect x="440" y="370" width="280" height="100" rx="13" fill="#e9f7ee" stroke="#42996a" stroke-width="1.6" /><text x="458" y="408" class="node-title">Autorização da rota</text><text x="458" y="435" class="node-sub">Escopo · origem · revisão</text></g><g><rect x="840" y="370" width="280" height="100" rx="13" fill="#e9f7ee" stroke="#42996a" stroke-width="1.6" /><text x="858" y="408" class="node-title">Operação permitida</text><text x="858" y="435" class="node-sub">Dados mínimos ou erro explícito</text></g><text x="40" y="595" font-size="12" fill="#526477">Segredos dos fornecedores ficam no Worker ou no n8n. Configurar a política Access é uma etapa externa ao código.</text></svg>